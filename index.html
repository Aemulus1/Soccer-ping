<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>PING — Curve Edition 2.0</title><style>body{margin:0;background:#0a1510;color:#f0f5f1;font:16px system-ui,sans-serif;display:flex;justify-content:center}main{width:min(100%,420px);box-sizing:border-box;padding:12px;display:flex;flex-direction:column;align-items:center;gap:9px}.score{width:100%;display:flex;align-items:center;justify-content:space-between;font-weight:800}.score strong{font-size:24px}small{opacity:.7}canvas{display:block;width:100%;max-width:390px;height:auto;aspect-ratio:540/880;touch-action:none;border-radius:12px;border:1px solid #496356;background:#102018}button{padding:12px 18px;border-radius:22px;background:#234b37;color:white;border:1px solid #789380;font-weight:700;cursor:pointer}#pause{background:#193326}#msg{text-align:center;font-size:13px;opacity:.85}</style></head><body><main><div class="score"><span>🔵 KRIS</span><strong id="score">0 — 0</strong><span>OMNIA 🔴</span></div><small>EERSTE TOT 10</small><canvas id="game" width="540" height="880"></canvas><div><button id="start">START MATCH</button> <button id="pause">PAUZE</button></div><div id="msg">Links raken = links schieten · Rechts raken = rechts schieten</div><small>Created by Kris &amp; Omnia · 2026</small></main><script>
(()=>{'use strict';
const c=document.getElementById('game'),g=c.getContext('2d'),score=document.getElementById('score'),msg=document.getElementById('msg'),start=document.getElementById('start'),pause=document.getElementById('pause');
const W=540,H=880,BOTTOM=820,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let kris={x:220,y:783,w:100,h:14},omnia={x:220,y:23,w:100,h:14},ball,players=[],ks=0,os=0,playing=false,over=false,panic=false,skill=.66,target=270,think=0,drag=false;
function centerBall(){ball={x:270,y:410,r:9,vx:0,vy:0,waiting:true,immunity:0,keeperCooldown:0}}
function makePlayers(){players=[];for(let team=0;team<2;team++)for(let i=0;i<4;i++){const chaser=i===0;players.push({id:team+'-'+i,team,chaser,x:chaser?270+(team===1?-100:100):55+Math.random()*430,y:chaser?(team===1?570:250):95+Math.random()*625,vx:(1+Math.random()*1.6)*(Math.random()<.5?-1:1),vy:(1+Math.random()*1.6)*(Math.random()<.5?-1:1),angle:Math.random()*Math.PI*2,change:0,mode:'chase'})}}
function newMatch(){ks=os=0;playing=true;over=panic=false;skill=.66;kris.x=omnia.x=220;think=0;makePlayers();centerBall();score.textContent='0 — 0';msg.textContent='De gebogen keepers zijn klaar! 😈';start.textContent='HERSTART MATCH';pause.textContent='PAUZE'}
function curveY(p,x,blue){const t=cl((x-(p.x+50))/50,-1,1);return p.y+7+(blue?1:-1)*(-13*(1-t*t))}
function keeperHit(p,blue){if(ball.keeperCooldown>0)return;if(blue?ball.vy<=0:ball.vy>=0)return;if(ball.x<p.x-9||ball.x>p.x+109)return;const cy=curveY(p,ball.x,blue);if(Math.abs(ball.y-cy)>13)return;const t=cl((ball.x-(p.x+50))/50,-1,1),speed=cl(Math.hypot(ball.vx,ball.vy)*1.04,6,12);const lateral=cl(t*.72+ball.vx/speed*.18,-.85,.85);ball.vx=lateral*speed;ball.vy=(blue?-1:1)*Math.sqrt(Math.max(1,speed*speed-ball.vx*ball.vx));ball.y=cy+(blue?-16:16);ball.keeperCooldown=8;if(blue)skill=cl(skill+.004,.66,.88)}
function playerHit(o){if(ball.immunity>0)return;const dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy);if(d>=27)return;const speed=ball.waiting?6:cl(Math.hypot(ball.vx,ball.vy)*1.02,5.8,11);let angle=cl(dx/27+(Math.random()-.5)*1.35,-1.12,1.12);if(Math.abs(angle)<.2)angle=(Math.random()<.5?-1:1)*(.25+Math.random()*.35);const blue=o.team===1;ball.vy=(blue?-1:1)*Math.abs(Math.cos(angle)*speed);ball.vx=Math.sin(angle)*speed;ball.x=cl(o.x+Math.sin(angle)*29,9,W-9);ball.y=cl(o.y+(blue?-31:31),9,BOTTOM-9);ball.immunity=11;if(o.chaser){o.mode='wander';o.change=45+Math.random()*40;o.angle=Math.random()*Math.PI*2}if(ball.waiting){ball.waiting=false;msg.textContent=blue?'🔵 Blauw trapt af!':'🔴 Rood trapt af!'}}
function predict(){if(ball.waiting||ball.vy>=0)return W/2;const t=(omnia.y-ball.y)/ball.vy,p=2*W;let x=ball.x+ball.vx*t;x=((x%p)+p)%p;return x>W?p-x:x}
function point(who){if(who==='k')ks++;else os++;score.textContent=ks+' — '+os;if(ks>=10||os>=10){over=true;playing=false;panic=false;msg.textContent=ks>=10?'🏆 KRIS WINT!':'🏆 OMNIA WINT!';start.textContent='NIEUWE MATCH';return}if(ks===9&&os===9&&!panic){panic=true;players.forEach(o=>{o.vx*=1.25;o.vy*=1.25});msg.textContent='⚡ PING PANIC — 9–9! ⚡'}else msg.textContent=who==='k'?'Punt Kris! 🔵 Nieuwe aftrap.':'Punt Omnia! 🔴 Nieuwe aftrap.';centerBall()}
function moveChaser(o){o.change--;if(o.change<=0){o.change=35+Math.random()*75;o.angle=Math.random()*Math.PI*2;o.mode=Math.random()<.24?'wander':'chase'}let tx,ty;if(o.mode==='wander'){tx=o.x+Math.cos(o.angle)*110;ty=o.y+Math.sin(o.angle)*110}else{const radius=12+Math.random()*14;tx=ball.x+Math.cos(o.angle)*radius;ty=ball.y+Math.sin(o.angle)*radius}tx=cl(tx,35,W-35);ty=cl(ty,65,BOTTOM-65);const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy)||1,speed=panic?3.35:2.65;o.vx+=(dx/d*speed-o.vx)*.095;o.vy+=(dy/d*speed-o.vy)*.095;const mag=Math.hypot(o.vx,o.vy);if(mag>speed){o.vx=o.vx/mag*speed;o.vy=o.vy/mag*speed}}
function update(){if(!playing)return;for(const o of players){if(o.chaser)moveChaser(o);o.x+=o.vx;o.y+=o.vy;if(o.x<35||o.x>W-35){o.vx*=-1;o.x=cl(o.x,35,W-35);if(o.chaser)o.angle=Math.PI-o.angle}if(o.y<65||o.y>BOTTOM-65){o.vy*=-1;o.y=cl(o.y,65,BOTTOM-65);if(o.chaser)o.angle=-o.angle}}if(--think<=0){think=10+Math.random()*12;target=predict()+(1-skill)*(Math.random()-.5)*240;if(Math.random()<.08)target=W-target}const s=3.7+skill*2.1;omnia.x=cl(omnia.x+cl(target-(omnia.x+50),-s,s),0,W-100);if(!ball.waiting){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<9||ball.x>W-9){ball.vx*=-1;ball.x=cl(ball.x,9,W-9)}if(ball.keeperCooldown>0)ball.keeperCooldown--;keeperHit(kris,true);keeperHit(omnia,false)}if(ball.immunity>0)ball.immunity--;for(const o of players){if(ball.immunity>0)break;playerHit(o)}if(!ball.waiting){if(ball.y>BOTTOM)point('o');else if(ball.y<0)point('k')}}
function drawPlayer(o){g.save();g.translate(o.x,o.y);g.strokeStyle=o.team===1?'#2388ff':'#ef3f45';g.fillStyle=g.strokeStyle;g.lineWidth=6;g.lineCap='round';g.beginPath();g.arc(0,-10,7,0,Math.PI*2);g.fill();g.beginPath();g.moveTo(0,-3);g.lineTo(0,10);g.moveTo(0,1);g.lineTo(-9,7);g.moveTo(0,1);g.lineTo(9,7);g.moveTo(0,10);g.lineTo(-7,20);g.moveTo(0,10);g.lineTo(7,20);g.stroke();g.restore()}
function drawKeeper(p,blue){g.strokeStyle=blue?'#2388ff':'#ef3f45';g.lineWidth=14;g.lineCap='round';g.beginPath();for(let i=0;i<=24;i++){const x=p.x+i*p.w/24,y=curveY(p,x,blue);if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke()}
function draw(){g.fillStyle=panic?'#251815':'#102018';g.fillRect(0,0,W,BOTTOM);players.forEach(drawPlayer);drawKeeper(omnia,false);drawKeeper(kris,true);g.fillStyle='#f3f5f4';g.beginPath();g.arc(ball.x,ball.y,9,0,Math.PI*2);g.fill();g.fillStyle='#091811';g.fillRect(0,BOTTOM,W,H-BOTTOM);g.strokeStyle='#658879';g.lineWidth=2;g.beginPath();g.moveTo(0,BOTTOM);g.lineTo(W,BOTTOM);g.stroke();const cx=kris.x+50;g.strokeStyle='#aec8d7';g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(cx,kris.y+14);g.lineTo(cx,837);g.stroke();g.fillStyle='#2388ff';g.strokeStyle='#e2f4ff';g.lineWidth=3;g.beginPath();g.arc(cx,849,22,0,Math.PI*2);g.fill();g.stroke();g.fillStyle='#cbeaff';g.beginPath();g.arc(cx,849,7,0,Math.PI*2);g.fill();if(!playing){g.textAlign='center';g.fillStyle='#f3f5f4';g.font='bold 32px system-ui';g.fillText(over?(ks>os?'KRIS WINT!':'OMNIA WINT!'):'PING',W/2,410)}}
function loop(){update();draw();requestAnimationFrame(loop)}
function move(e){const r=c.getBoundingClientRect();kris.x=cl((e.clientX-r.left)*W/r.width-50,0,W-100)}
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),y=(e.clientY-r.top)*H/r.height;if(y>=BOTTOM-25){drag=true;c.setPointerCapture?.(e.pointerId);move(e)}});c.addEventListener('pointermove',e=>{if(drag)move(e)});const end=()=>drag=false;c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('lostpointercapture',end);start.addEventListener('click',newMatch);pause.addEventListener('click',()=>{if(over)return;playing=!playing;pause.textContent=playing?'PAUZE':'VERDER'});makePlayers();centerBall();draw();loop();
})();
</script></body></html>
